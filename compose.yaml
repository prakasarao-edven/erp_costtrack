services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: costbridge
      POSTGRES_USER: costbridge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .local/postgres.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U costbridge -d costbridge"]
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres_data:
